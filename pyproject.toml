[project]
name = "xenarch"
version = "0.1.0"
description = "Unsupervised anomaly detection for planetary surface imagery"
requires-python = ">=3.11"
dependencies = [
    # core numerics / imaging
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pillow==12.3.0",
    # web layer (xenarch_mk20_script.py) -- imported and configured at
    # module level (logger.add, Flask app construction) with no guard, and
    # transitively required by finetune20.py/eval_scoring.py since both
    # importlib-load mk20 as a library. No fallback is possible without
    # code changes, so these stay hard dependencies.
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "loguru==0.7.3",
    # data harvesting (lroc_fetch.py, apollo16_agent.py)
    "requests==2.34.2",
    "tqdm==4.70.0",
    # planetary raster I/O — required to read PDS3 .IMG frames (LRO NAC,
    # HiRISE, CTX) and GeoTIFFs; without it scripts silently fall back to
    # Pillow, which cannot open .IMG at all
    "rasterio==1.4.4",
    # config schema validation
    "pydantic>=2.7",
]

# Each of these is a genuine optional extra, not a hard dependency -- either
# a working fallback already exists in the code, or the capability itself
# is skippable for the core train/score path. Install with
# `uv sync --extra <name>` (or `pip install .[<name>]`).
[project.optional-dependencies]
# mk20's own HAS_TORCH guard (try/except ImportError at import time) cleanly
# falls back to its NumpyAnomalyScorer without it -- that fallback path is
# exactly what eval_scoring.py's test already exercises.
torch = ["torch==2.13.0"]
# gunicorn is never imported by any Python file in this repo's active
# surface -- it's only ever invoked externally as
# `gunicorn xenarch_mk20_script:app` (see that file's own docstring) to
# serve it in production. Zero import-time risk to split out.
server = ["gunicorn==23.0.0"]
# Only finetune20.py needs this (its Bayesian/Halving hyperparameter-search
# strategies), and unlike torch there's no graceful degrade -- that script
# just won't run without it. finetune20.py itself has no test coverage in
# this repo (a real gap, out of scope here), so treating it as always-on
# would be pretending a capability nothing verifies is core.
finetune = ["optuna>=3.6"]

[dependency-groups]
dev = [
    # CI runs `uv run pytest tests/` — installed by default (uv syncs the
    # "dev" group unless --no-dev is passed).
    "pytest>=8.0",
    # ruff is invoked via `uv run ruff` in CI, so it must be an actual
    # project dependency (not just available via `uvx ruff` locally) or
    # `uv run ruff` fails with "Failed to spawn: ruff — No such file or
    # directory" -- caught by an actual CI run, not assumed.
    "ruff>=0.8",
]

# This is a scripts repo, not an installable package — no build backend,
# no src/ layout. Scope: xenarch_mk20_script.py, finetune20.py,
# xenarch_pipeline.py, lroc_fetch.py. The archived xenarch_mk3-mk19
# scripts need extra legacy deps (matplotlib, seaborn, pandas, geopandas,
# shapely, psycopg2-binary, torchvision) not listed here — they're not
# part of the active surface this covers.
[tool.uv]
package = false

# The default PyPI torch wheel bundles the full CUDA runtime (~3 GB across
# nvidia-cu* packages) even on machines with no GPU. Route torch through
# PyTorch's own CPU-only wheel index instead — same pinned version, a
# fraction of the download, works everywhere without an opt-out step.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
# ruff's default file resolver also scans *.md files (linting embedded
# Python code-fence blocks) -- not wanted here: README.md's example CLI
# commands aren't meant to pass strict Python lint rules. Restrict back to
# actual source files.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade (modern typing syntax, etc.)
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
]
