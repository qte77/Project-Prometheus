<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xenarch · Live Conv Autoencoder</title>
<style>
  :root{
    --bg:#0e0f12; --panel:#15171c; --panel-2:#1b1e24; --line:#282c34;
    --ink:#e8e9ec; --dim:#888e99; --faint:#5b616c;
    --accent:#d9a441; --accent-2:#e7be6e;
    --pos:#d9663f; --neg:#4f7fd0; --ok:#5fae7f;
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono","Consolas",monospace;
    --sans:system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand{font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent)}
  .brand b{color:var(--ink); font-weight:500}
  .tgroup{display:flex; align-items:center; gap:8px}
  button.ctl{
    font-family:var(--mono); font-size:12px; color:var(--ink);
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding:6px 12px; cursor:pointer;
  }
  button.ctl:hover{border-color:var(--accent); color:var(--accent-2)}
  button.ctl.primary{background:var(--accent); color:#1a1400; border-color:var(--accent)}
  button.ctl.primary:hover{background:var(--accent-2)}
  .field{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; color:var(--dim)}
  .field input[type=range]{accent-color:var(--accent); width:98px}
  .hbar{display:flex; align-items:center; gap:22px; flex-wrap:wrap; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel-2)}
  .hbar .cap{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
  .hbar .field{cursor:help}
  .hv{color:var(--accent); font-variant-numeric:tabular-nums; min-width:3.4em}
  select.ctl{font-family:var(--mono); font-size:12px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 8px}
  .stat{font-family:var(--mono); font-size:12px; color:var(--dim)}
  .stat b{color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums}
  .stat.big b{color:var(--accent); font-size:15px}
  canvas#spark{background:var(--panel-2); border:1px solid var(--line); border-radius:5px; display:block}

  /* ---------- pipeline ---------- */
  .stage{flex:1 1 auto; overflow:auto; padding:24px 16px; display:flex; align-items:center}
  .pipe{
    display:flex; align-items:flex-start; gap:0; min-width:min-content; margin:0 auto;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px; min-width:194px; align-self:flex-start;
    display:flex; flex-direction:column; gap:9px;
    transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .card.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 22px -8px var(--accent)}
  .card .hd{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .card .nm{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink)}
  .card .dim{font-family:var(--mono); font-size:11px; color:var(--accent); font-variant-numeric:tabular-nums}
  .card .lbl{font-family:var(--mono); font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; margin-top:2px}
  .card canvas{
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#000; border:1px solid var(--line); border-radius:4px; display:block;
  }
  .card .meta{font-family:var(--mono); font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums}
  .arrow{
    align-self:flex-start; margin-top:130px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:0 6px; color:var(--faint);
  }
  .arrow .op{font-family:var(--mono); font-size:10px; color:var(--dim); white-space:nowrap}
  .arrow svg{display:block}

  /* ---------- footer ---------- */
  .footer{
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
    padding:10px 16px; border-top:1px solid var(--line); background:var(--panel);
  }
  .io{display:flex; align-items:center; gap:10px}
  .io figure{margin:0; display:flex; flex-direction:column; align-items:center; gap:4px}
  .io figcaption{font-family:var(--mono); font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.08em}
  .io canvas{image-rendering:pixelated; border:1px solid var(--line); border-radius:4px; background:#000}
  .dws{display:flex; align-items:flex-end; gap:6px; height:40px}
  .dws .b{width:16px; background:var(--accent); border-radius:2px 2px 0 0; min-height:2px; transition:height .12s linear}
  .dws .c{display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--mono); font-size:9px; color:var(--faint)}
  .legend{font-family:var(--mono); font-size:10px; color:var(--dim); display:flex; gap:14px; align-items:center}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:5px}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand"><b>Xenarch</b> · live conv autoencoder</span>
  <div class="tgroup">
    <button class="ctl primary" id="btnPlay">Pause</button>
    <button class="ctl" id="btnStep">Step</button>
    <button class="ctl" id="btnReset">Reset</button>
  </div>
  <div class="field">
    speed
    <select class="ctl" id="selSpeed">
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
      <option value="4">4×</option>
      <option value="8">8×</option>
    </select>
  </div>
  <span class="stat">step <b id="stStep">0</b></span>
  <span class="stat big">loss <b id="stLoss">—</b></span>
  <canvas id="spark" width="220" height="34"></canvas>
</div>

<div class="hbar">
  <span class="cap">hyperparameters</span>
  <div class="field" title="learning rate — step size of every weight update. High: fast but unstable. Low: slow but stable. Real Xenarch uses 5e-4.">
    lr <input type="range" id="rngLr" min="0" max="100" value="50" />
    <span id="lrVal" class="hv">1.0e-3</span>
  </div>
  <div class="field" title="latent dimension — how many numbers z compresses each tile into. Smaller = harsher bottleneck. Real Xenarch uses 56. Changing this rebuilds the network.">
    latent dim <input type="range" id="rngLat" min="2" max="24" step="1" value="8" />
    <span id="latVal" class="hv">8</span>
  </div>
  <div class="field" title="batch size — how many tiles are averaged before each weight update. Larger = smoother, less noisy gradient.">
    batch <input type="range" id="rngBs" min="1" max="24" step="1" value="8" />
    <span id="bsVal" class="hv">8</span>
  </div>
</div>

<div class="stage">
  <div class="pipe" id="pipe"></div>
</div>

<div class="footer">
  <div class="io">
    <figure><canvas id="ioIn" width="16" height="16" style="width:96px;height:96px"></canvas><figcaption>input tile</figcaption></figure>
    <div class="arrow"><span class="op">reconstruct</span>
      <svg width="34" height="10"><path d="M0 5 H28 M24 1 L30 5 L24 9" stroke="#5b616c" fill="none" stroke-width="1.4"/></svg>
    </div>
    <figure><canvas id="ioOut" width="16" height="16" style="width:96px;height:96px"></canvas><figcaption>reconstruction</figcaption></figure>
    <figure><canvas id="ioErr" width="16" height="16" style="width:96px;height:96px"></canvas><figcaption>abs error</figcaption></figure>
  </div>
  <div class="dws" id="dws" title="mean |Δweight| this step, per layer"></div>
  <div class="legend">
    <span><i style="background:var(--accent)"></i>activation</span>
    <span><i style="background:var(--neg)"></i>w &lt; 0</span>
    <span><i style="background:#9a9a9e"></i>0</span>
    <span><i style="background:var(--pos)"></i>w &gt; 0</span>
  </div>
</div>

<script>
"use strict";
(function(){

/* ============================================================
   0.  small numeric toolkit
   ============================================================ */
var _s = 1234567;
function rand(){ _s ^= _s<<13; _s ^= _s>>>17; _s ^= _s<<5; return ((_s>>>0)/4294967296); }
function randn(){ var u=1-rand(), v=rand(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function fa(n){ return new Float32Array(n); }
function fill(n, std){ var a=fa(n); for(var i=0;i<n;i++) a[i]=randn()*std; return a; }
function zeros(n){ return fa(n); }

/* conv2d, valid, pad=1, stride=s   ->  out = ceil(in/s)          */
function conv(x,xC,xH,xW, W,b,oC,s){
  var oH=Math.ceil(xH/s), oW=Math.ceil(xW/s), out=fa(oC*oH*oW);
  for(var oc=0;oc<oC;oc++){
    for(var oy=0;oy<oH;oy++){ for(var ox=0;ox<oW;ox++){
      var acc=b[oc];
      for(var ic=0;ic<xC;ic++){
        var wb=((oc*xC+ic)*3)*3, xb=ic*xH*xW;
        for(var ky=0;ky<3;ky++){
          var iy=oy*s-1+ky; if(iy<0||iy>=xH) continue;
          for(var kx=0;kx<3;kx++){
            var ix=ox*s-1+kx; if(ix<0||ix>=xW) continue;
            acc+=x[xb+iy*xW+ix]*W[wb+ky*3+kx];
          }
        }
      }
      out[(oc*oH+oy)*oW+ox]=acc;
    }}
  }
  return {v:out,C:oC,H:oH,W:oW};
}
function convBwd(x,xC,xH,xW, W,oC,oH,oW,s, dO, dW,db){
  var dx=fa(xC*xH*xW);
  for(var oc=0;oc<oC;oc++){
    for(var oy=0;oy<oH;oy++){ for(var ox=0;ox<oW;ox++){
      var g=dO[(oc*oH+oy)*oW+ox]; if(g===0) continue;
      db[oc]+=g;
      for(var ic=0;ic<xC;ic++){
        var wb=((oc*xC+ic)*3)*3, xb=ic*xH*xW;
        for(var ky=0;ky<3;ky++){
          var iy=oy*s-1+ky; if(iy<0||iy>=xH) continue;
          for(var kx=0;kx<3;kx++){
            var ix=ox*s-1+kx; if(ix<0||ix>=xW) continue;
            var xi=xb+iy*xW+ix, wi=wb+ky*3+kx;
            dW[wi]+=x[xi]*g; dx[xi]+=W[wi]*g;
          }
        }
      }
    }}
  }
  return dx;
}
/* transposed conv, stride 2, k3, pad1, output_padding1  -> out = 2*in
   weight layout [inC, outC, 3, 3]                                     */
function convT(x,xC,xH,xW, W,b,oC){
  var oH=xH*2, oW=xW*2, out=fa(oC*oH*oW);
  for(var oc=0;oc<oC;oc++){ var ob=oc*oH*oW; for(var i=0;i<oH*oW;i++) out[ob+i]=b[oc]; }
  for(var ic=0;ic<xC;ic++){
    var xb=ic*xH*xW;
    for(var iy=0;iy<xH;iy++){ for(var ix=0;ix<xW;ix++){
      var v=x[xb+iy*xW+ix]; if(v===0) continue;
      for(var ky=0;ky<3;ky++){
        var oy=iy*2-1+ky; if(oy<0||oy>=oH) continue;
        for(var kx=0;kx<3;kx++){
          var ox=ix*2-1+kx; if(ox<0||ox>=oW) continue;
          for(var oc2=0;oc2<oC;oc2++){
            out[oc2*oH*oW+oy*oW+ox]+=W[((ic*oC+oc2)*3+ky)*3+kx]*v;
          }
        }
      }
    }}
  }
  return {v:out,C:oC,H:oH,W:oW};
}
function convTBwd(x,xC,xH,xW, W,oC, dO, dW,db){
  var oH=xH*2, oW=xW*2, dx=fa(xC*xH*xW);
  for(var oc=0;oc<oC;oc++){ var ob=oc*oH*oW; for(var i=0;i<oH*oW;i++) db[oc]+=dO[ob+i]; }
  for(var ic=0;ic<xC;ic++){
    var xb=ic*xH*xW;
    for(var iy=0;iy<xH;iy++){ for(var ix=0;ix<xW;ix++){
      var xi=xb+iy*xW+ix, v=x[xi], acc=0;
      for(var ky=0;ky<3;ky++){
        var oy=iy*2-1+ky; if(oy<0||oy>=oH) continue;
        for(var kx=0;kx<3;kx++){
          var ox=ix*2-1+kx; if(ox<0||ox>=oW) continue;
          for(var oc2=0;oc2<oC;oc2++){
            var g=dO[oc2*oH*oW+oy*oW+ox], wi=((ic*oC+oc2)*3+ky)*3+kx;
            dW[wi]+=v*g; acc+=W[wi]*g;
          }
        }
      }
      dx[xi]=acc;
    }}
  }
  return dx;
}
function fc(x,I,O,W,b){ var o=fa(O); for(var j=0;j<O;j++){ var a=b[j],wb=j*I; for(var i=0;i<I;i++) a+=x[i]*W[wb+i]; o[j]=a; } return o; }
function fcBwd(x,I,O,W, dO, dW,db){ var dx=fa(I); for(var j=0;j<O;j++){ var g=dO[j]; db[j]+=g; var wb=j*I; for(var i=0;i<I;i++){ dW[wb+i]+=x[i]*g; dx[i]+=W[wb+i]*g; } } return dx; }
function reluF(a){ var o=fa(a.length); for(var i=0;i<a.length;i++) o[i]=a[i]>0?a[i]:0; return o; }
function reluB(pre,dO){ var d=fa(pre.length); for(var i=0;i<pre.length;i++) d[i]=pre[i]>0?dO[i]:0; return d; }

/* ============================================================
   1.  the network   1x16x16  ->  z(8)  ->  1x16x16
   ============================================================ */
var L = [
  {nm:"input",  dim:"1 · 16 · 16", lbl:"tile"},
  {nm:"conv1",  dim:"4 · 8 · 8",   lbl:"feature maps", op:"conv 3×3 s2 · relu", tf:"16² → 8²  ·  1→4 ch"},
  {nm:"conv2",  dim:"8 · 4 · 4",   lbl:"feature maps", op:"conv 3×3 s2 · relu", tf:"8² → 4²  ·  4→8 ch"},
  {nm:"z",      dim:"8",           lbl:"latent code",  op:"flatten 128 · dense", tf:"128 → 8"},
  {nm:"proj",   dim:"8 · 4 · 4",   lbl:"decoder seed", op:"dense · reshape · relu", tf:"8 → 128"},
  {nm:"deconv1",dim:"4 · 8 · 8",   lbl:"feature maps", op:"convT 3×3 s2 · relu", tf:"4² → 8²  ·  8→4 ch"},
  {nm:"output", dim:"1 · 16 · 16", lbl:"reconstruction", op:"convT 3×3 s2 · sigmoid", tf:"8² → 16²  ·  4→1 ch"}
];

var P;            // parameters + adam state
var LATENT = 8;   // hyperparameter: latent code size (slider)
function initNet(){
  function grp(n, std){ return {w:fill(n,std), g:zeros(n), m:zeros(n), v:zeros(n)}; }
  P = {
    W1:grp(4*1*9, Math.sqrt(2/9)),           b1:grp(4,0),
    W2:grp(8*4*9, Math.sqrt(2/(4*9))),       b2:grp(8,0),
    W3:grp(LATENT*128, Math.sqrt(1/128)),    b3:grp(LATENT,0),
    W4:grp(128*LATENT, Math.sqrt(1/LATENT)), b4:grp(128,0),
    W5:grp(8*4*9, Math.sqrt(2/(8*9))),  b5:grp(4,0),
    W6:grp(4*1*9, Math.sqrt(1/(4*9))),  b6:grp(1,0),
    t:0
  };
}
function zeroGrads(){ for(var k in P){ if(P[k].g) P[k].g.fill(0); } }
function adam(lr){
  P.t++;
  var b1=0.9,b2=0.999,eps=1e-8, bc1=1-Math.pow(b1,P.t), bc2=1-Math.pow(b2,P.t);
  var dw={};
  for(var k in P){
    var pr=P[k]; if(!pr.g) continue;
    var s=0, n=pr.w.length;
    for(var i=0;i<n;i++){
      var g=pr.g[i]/BATCH;
      pr.m[i]=b1*pr.m[i]+(1-b1)*g;
      pr.v[i]=b2*pr.v[i]+(1-b2)*g*g;
      var step=lr*(pr.m[i]/bc1)/(Math.sqrt(pr.v[i]/bc2)+eps);
      pr.w[i]-=step; s+=Math.abs(step);
    }
    dw[k]=s/n;
  }
  return dw;
}

/* forward one sample, keep caches; return {out, caches} */
function forward(x){
  var c={};
  c.x=x;
  var a1=conv(x,1,16,16, P.W1.w,P.b1.w,4,2); c.a1pre=a1.v; c.a1=reluF(a1.v);
  var a2=conv(c.a1,4,8,8, P.W2.w,P.b2.w,8,2); c.a2pre=a2.v; c.a2=reluF(a2.v);
  var z=fc(c.a2,128,LATENT, P.W3.w,P.b3.w); c.z=z;                 // latent (linear)
  var p=fc(z,LATENT,128, P.W4.w,P.b4.w); c.ppre=p; c.p=reluF(p);   // decoder seed
  var d1=convT(c.p,8,4,4, P.W5.w,P.b5.w,4); c.d1pre=d1.v; c.d1=reluF(d1.v);
  var d2=convT(c.d1,4,8,8, P.W6.w,P.b6.w,1); c.d2pre=d2.v;
  var out=fa(256); for(var i=0;i<256;i++) out[i]=1/(1+Math.exp(-c.d2pre[i]));
  c.out=out;
  return c;
}
function backwardReal(c){
  var N=256, dOut=fa(N), loss=0;
  for(var i=0;i<N;i++){ var e=c.out[i]-c.x[i]; loss+=e*e; dOut[i]=(2*e/N)*c.out[i]*(1-c.out[i]); }
  loss/=N;
  var dd1 = convTBwd(c.d1,4,8,8, P.W6.w,1, dOut, P.W6.g,P.b6.g);        // out = convT(d1,W6)
  var dd1p = reluB(c.d1pre, dd1);
  var dp  = convTBwd(c.p,8,4,4, P.W5.w,4, dd1p, P.W5.g,P.b5.g);        // d1 = convT(p,W5)
  var dppre = reluB(c.ppre, dp);
  var dz  = fcBwd(c.z,LATENT,128, P.W4.w, dppre, P.W4.g,P.b4.g);        // p = fc(z,W4)
  var da2 = fcBwd(c.a2,128,LATENT, P.W3.w, dz, P.W3.g,P.b3.g);         // z = fc(a2,W3)
  var da2p= reluB(c.a2pre, da2);
  var da1 = convBwd(c.a1,4,8,8, P.W2.w,8,4,4,2, da2p, P.W2.g,P.b2.g);  // a2 = conv(a1,W2)
  var da1p= reluB(c.a1pre, da1);
  convBwd(c.x,1,16,16, P.W1.w,4,8,8,2, da1p, P.W1.g,P.b1.g);          // a1 = conv(x,W1)
  return loss;
}

/* ============================================================
   2.  synthetic "terrain" tiles
   ============================================================ */
var BATCH=8, batch=[];
function makeTile(){
  var t=fa(256);
  var gx=(rand()-0.5)*0.5, gy=(rand()-0.5)*0.5, base=0.45+(rand()-0.5)*0.2;
  var fx=1+rand()*2, ph=rand()*6.28;
  for(var y=0;y<16;y++) for(var x=0;x<16;x++){
    var v=base + gx*(x/16-0.5) + gy*(y/16-0.5) + 0.08*Math.sin(fx*(x+y)/3+ph);
    t[y*16+x]=v;
  }
  var nc=1+((rand()*3)|0);
  for(var k=0;k<nc;k++){
    var cx=2+rand()*12, cy=2+rand()*12, r=1.6+rand()*3.4, depth=0.15+rand()*0.28;
    for(var y2=0;y2<16;y2++) for(var x2=0;x2<16;x2++){
      var d=Math.hypot(x2-cx,y2-cy)/r;
      if(d<1) t[y2*16+x2]-=depth*(1-d*d);
      else if(d<1.35) t[y2*16+x2]+=depth*0.5*(1.35-d)/0.35; // bright rim
    }
  }
  for(var i=0;i<256;i++) t[i]+= (rand()-0.5)*0.05;
  var mn=Infinity,mx=-Infinity;
  for(i=0;i<256;i++){ if(t[i]<mn)mn=t[i]; if(t[i]>mx)mx=t[i]; }
  for(i=0;i<256;i++) t[i]=(t[i]-mn)/(mx-mn+1e-6);
  return t;
}
function newBatch(){ batch=[]; for(var i=0;i<BATCH;i++) batch.push(makeTile()); }

/* ============================================================
   3.  colour maps + raster helpers
   ============================================================ */
function seq(t){ // 0..1  -> near-black to amber
  t=t<0?0:t>1?1:t; t=Math.pow(t,0.85);
  var r=14+(217-14)*t, g=15+(164-15)*t, b=18+(65-18)*t;
  return [r|0,g|0,b|0];
}
function div(t){ // -1..1 diverging blue-grey-orange
  t=t<-1?-1:t>1?1:t;
  var a=Math.abs(t);
  if(t<0) return [ (154+(79-154)*a)|0, (156+(127-156)*a)|0, (161+(208-161)*a)|0 ];
  return [ (154+(217-154)*a)|0, (156+(102-156)*a)|0, (161+(63-161)*a)|0 ];
}
/* draw a set of C maps (H×W) into canvas, per-map min-max, wrap `perRow` */
function drawMaps(cv, data, C,H,W, perRow, cmap){
  perRow=Math.min(perRow,C);
  var rows=Math.ceil(C/perRow);
  var gw=perRow*W+(perRow-1), gh=rows*H+(rows-1);
  cv.width=gw; cv.height=gh;
  var ctx=cv.getContext("2d"), img=ctx.createImageData(gw,gh);
  // paint gaps with line colour
  for(var i=0;i<gw*gh;i++){ img.data[i*4]=40; img.data[i*4+1]=44; img.data[i*4+2]=52; img.data[i*4+3]=255; }
  for(var c=0;c<C;c++){
    var mn=Infinity,mx=-Infinity, off=c*H*W;
    for(var k=0;k<H*W;k++){ var val=data[off+k]; if(val<mn)mn=val; if(val>mx)mx=val; }
    var rng=mx-mn||1;
    var cr=(c/perRow|0), cc=c%perRow, ox=cc*(W+1), oy=cr*(H+1);
    for(var y=0;y<H;y++) for(var x=0;x<W;x++){
      var nv=(data[off+y*W+x]-mn)/rng;
      var col=cmap(cmap===div? (nv*2-1) : nv);
      var p=((oy+y)*gw+(ox+x))*4;
      img.data[p]=col[0]; img.data[p+1]=col[1]; img.data[p+2]=col[2]; img.data[p+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}
/* weight heatmap: cols×rows, symmetric diverging */
function drawHeat(cv, w, cols, rows){
  cv.width=cols; cv.height=rows;
  var mx=1e-6; for(var i=0;i<w.length;i++){ var a=Math.abs(w[i]); if(a>mx) mx=a; }
  var ctx=cv.getContext("2d"), img=ctx.createImageData(cols,rows);
  for(i=0;i<cols*rows;i++){
    var col=div(w[i]/mx);
    img.data[i*4]=col[0]; img.data[i*4+1]=col[1]; img.data[i*4+2]=col[2]; img.data[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
}
function drawVec(cv, data){ // n values on a shared symmetric diverging scale
  var n=data.length; cv.width=n; cv.height=1;
  var mx=1e-6; for(var i=0;i<n;i++){ var a=Math.abs(data[i]); if(a>mx) mx=a; }
  var ctx=cv.getContext("2d"), img=ctx.createImageData(n,1);
  for(i=0;i<n;i++){ var col=div(data[i]/mx); img.data[i*4]=col[0]; img.data[i*4+1]=col[1]; img.data[i*4+2]=col[2]; img.data[i*4+3]=255; }
  ctx.putImageData(img,0,0);
}
function drawTile(cv, data){ // 16×16 grayscale-ish -> amber ramp
  cv.width=16; cv.height=16;
  var ctx=cv.getContext("2d"), img=ctx.createImageData(16,16);
  for(var i=0;i<256;i++){ var col=seq(data[i]); img.data[i*4]=col[0]; img.data[i*4+1]=col[1]; img.data[i*4+2]=col[2]; img.data[i*4+3]=255; }
  ctx.putImageData(img,0,0);
}

/* ============================================================
   4.  build the pipeline DOM
   ============================================================ */
var pipe=document.getElementById("pipe"), cards={};
function arrowEl(op){
  var d=document.createElement("div"); d.className="arrow";
  d.innerHTML='<span class="op">'+op+'</span>'+
    '<svg width="46" height="12"><path d="M0 6 H38 M33 1 L41 6 L33 11" stroke="#3a3f49" fill="none" stroke-width="1.5"/></svg>';
  return d;
}
L.forEach(function(s,idx){
  if(idx>0) pipe.appendChild(arrowEl(s.tf));
  var c=document.createElement("div"); c.className="card"; c.dataset.i=idx;
  var actId="act"+idx, wId="w"+idx;
  var wRow = (idx>0 && idx<L.length) ?
    '<div class="lbl">weights</div><canvas id="'+wId+'" style="width:170px;height:'+(idx===4?'84px':'58px')+'"></canvas>' : '';
  var actStyle = idx===0||idx===6 ? "width:170px;height:170px"
               : idx===3 ? "width:170px;height:26px"
               : (idx===1||idx===5) ? "width:170px;height:58px"
               : "width:170px;height:112px";
  c.innerHTML=
    '<div class="hd"><span class="nm">'+s.nm+'</span><span class="dim">'+s.dim+'</span></div>'+
    '<div class="lbl">'+s.lbl+'</div>'+
    '<canvas id="'+actId+'" style="'+actStyle+'"></canvas>'+
    wRow+
    '<div class="meta" id="m'+idx+'">&nbsp;</div>';
  pipe.appendChild(c);
  cards[idx]=c;
});

var dwsEl=document.getElementById("dws");
["c1","c2","z","p","d1","o"].forEach(function(nm){
  var c=document.createElement("div"); c.className="c";
  c.innerHTML='<div class="b" id="dw_'+nm+'"></div>'+nm;
  dwsEl.appendChild(c);
});

/* ============================================================
   5.  render current state
   ============================================================ */
var lastC=null, lastDW=null;
function render(){
  var c=lastC; if(!c) return;
  drawTile(document.getElementById("act0"), c.x);
  drawMaps(document.getElementById("act1"), c.a1, 4,8,8, 4, seq);
  drawMaps(document.getElementById("act2"), c.a2, 8,4,4, 4, seq);
  drawVec(document.getElementById("act3"), c.z);
  drawMaps(document.getElementById("act4"), c.p,  8,4,4, 4, seq);
  drawMaps(document.getElementById("act5"), c.d1, 4,8,8, 4, seq);
  drawTile(document.getElementById("act6"), c.out);

  drawHeat(document.getElementById("w1"), P.W1.w, 9, 4);          // 4 kernels 3x3 -> 9 wide, 4 tall
  drawHeat(document.getElementById("w2"), P.W2.w, 36, 8);
  drawHeat(document.getElementById("w3"), P.W3.w, 128, LATENT);
  drawHeat(document.getElementById("w4"), P.W4.w, LATENT, 128);
  drawHeat(document.getElementById("w5"), P.W5.w, 36, 8);
  drawHeat(document.getElementById("w6"), P.W6.w, 9, 4);

  // io
  drawTile(document.getElementById("ioIn"), c.x);
  drawTile(document.getElementById("ioOut"), c.out);
  var err=fa(256); for(var i=0;i<256;i++) err[i]=Math.abs(c.out[i]-c.x[i]);
  drawTile(document.getElementById("ioErr"), err);

  if(lastDW){
    var map={dw_c1:"W1",dw_c2:"W2",dw_z:"W3",dw_p:"W4",dw_d1:"W5",dw_o:"W6"};
    var mx=1e-9; for(var k in map) mx=Math.max(mx, lastDW[map[k]]||0);
    for(k in map){ document.getElementById(k).style.height=Math.max(2, 40*(lastDW[map[k]]||0)/mx)+"px"; }
    var mm=[["m1","W1"],["m2","W2"],["m3","W3"],["m4","W4"],["m5","W5"],["m6","W6"]];
    mm.forEach(function(p){ document.getElementById(p[0]).textContent="Δw "+ (lastDW[p[1]]).toExponential(1); });
  }
}

/* forward-pass sweep highlight */
var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
var sweepTimers=[];
function sweep(){
  sweepTimers.forEach(clearTimeout); sweepTimers=[];
  Object.keys(cards).forEach(function(i){ cards[i].classList.remove("active"); });
  if(reduce) return;
  L.forEach(function(_,i){
    sweepTimers.push(setTimeout(function(){
      Object.keys(cards).forEach(function(j){ cards[j].classList.toggle("active", (+j)===i); });
      if(i===L.length-1) sweepTimers.push(setTimeout(function(){ cards[i].classList.remove("active"); },140));
    }, i*45));
  });
}

/* ============================================================
   6.  training loop
   ============================================================ */
var losses=[], step=0, playing=true, refreshBatchEvery=90;
function trainStep(){
  if(step>0 && step%refreshBatchEvery===0){ // swap one tile, keep it lively without spiking loss
    batch[(rand()*BATCH)|0]=makeTile();
  }
  zeroGrads();
  var L0=0, c0=null;
  for(var b=0;b<BATCH;b++){
    var c=forward(batch[b]);
    L0+=backwardReal(c);
    if(b===0) c0=c;
  }
  var lr=currentLr();
  lastDW=adam(lr);
  lastC=c0;
  var ml=L0/BATCH; losses.push(ml); if(losses.length>240) losses.shift();
  step++;
}

var spark=document.getElementById("spark"), sctx=spark.getContext("2d");
function drawSpark(){
  var W=spark.width,H=spark.height; sctx.clearRect(0,0,W,H);
  if(losses.length<2) return;
  var mx=Math.max.apply(null,losses), mn=Math.min.apply(null,losses), rng=mx-mn||1;
  sctx.strokeStyle="#d9a441"; sctx.lineWidth=1.5; sctx.beginPath();
  for(var i=0;i<losses.length;i++){
    var x=i/(losses.length-1)*(W-2)+1;
    var y=H-2-((losses[i]-mn)/rng)*(H-4);
    i?sctx.lineTo(x,y):sctx.moveTo(x,y);
  }
  sctx.stroke();
}
function updHud(){
  document.getElementById("stStep").textContent=step;
  document.getElementById("stLoss").textContent=losses.length?losses[losses.length-1].toFixed(4):"—";
  drawSpark();
}

/* ---- rAF driver ---- */
var acc=0;
function frame(){
  if(playing){
    var n=+document.getElementById("selSpeed").value;
    for(var i=0;i<n;i++) trainStep();
    sweep();
  }
  render(); updHud();
  requestAnimationFrame(frame);
}

/* ============================================================
   7.  controls
   ============================================================ */
function currentLr(){
  var v=+document.getElementById("rngLr").value;
  return Math.pow(10, -4 + 0.02*v); // 1e-4 .. 1e-2
}
function syncLrLabel(){ document.getElementById("lrVal").textContent=currentLr().toExponential(1); }
document.getElementById("rngLr").addEventListener("input", syncLrLabel);

/* latent dim + batch size sliders */
function setBatch(n){
  BATCH=n;
  while(batch.length<n) batch.push(makeTile());
  if(batch.length>n) batch.length=n;
  document.getElementById("bsVal").textContent=n;
}
function updLatentLabels(){
  var ops=document.querySelectorAll("#pipe .arrow .op");
  if(ops[2]) ops[2].textContent="128 → "+LATENT;
  if(ops[3]) ops[3].textContent=LATENT+" → 128";
  var zc=document.querySelector('.card[data-i="3"] .dim'); if(zc) zc.textContent=String(LATENT);
  document.getElementById("latVal").textContent=LATENT;
}
document.getElementById("rngBs").addEventListener("input", function(){ setBatch(+this.value); });
document.getElementById("rngLat").addEventListener("input", function(){
  LATENT=+this.value;
  initNet(); losses=[]; step=0; lastDW=null;   // architecture changed -> rebuild + restart
  updLatentLabels();
  lastC=forward(batch[0]); render(); updHud();
});
document.getElementById("btnPlay").addEventListener("click", function(){
  playing=!playing; this.textContent=playing?"Pause":"Play";
});
document.getElementById("btnStep").addEventListener("click", function(){
  playing=false; document.getElementById("btnPlay").textContent="Play";
  trainStep(); sweep(); render(); updHud();
});
document.getElementById("btnReset").addEventListener("click", function(){
  _s=1234567; initNet(); newBatch(); losses=[]; step=0; lastDW=null;
  lastC=forward(batch[0]); render(); updHud();
});

/* ============================================================
   8.  go
   ============================================================ */
initNet(); newBatch(); syncLrLabel(); updLatentLabels();
lastC=forward(batch[0]);
render(); updHud();
requestAnimationFrame(frame);

})();
</script>
